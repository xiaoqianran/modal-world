[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "modal-world"
version = "0.1.0"
description = "Extensible Modal provider for world-generation models"
requires-python = ">=3.10,<3.13"
dependencies = [
  "modal[api-proxy-support]>=1.5,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]
hyworld2 = []

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
